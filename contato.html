<!-- Faixa de Animação Pôr do Sol e Mar -->
<div style="width: 100%; height: 180px; overflow: hidden; line-height: 0;">
  <canvas id="mar-sol" style="width: 100%; height: 100%; display: block;"></canvas>
</div>

<script>
(() => {
  const c = document.getElementById('mar-sol'), ctx = c.getContext('2d');
  let t = 0, sunY = 175; // O sol começa escondido e sobe suavemente

  function resize() {
    c.width = c.parentElement.offsetWidth;
    c.height = 180;
  }
  window.addEventListener('resize', resize);
  resize();

  function draw() {
    t += 0.025;
    const w = c.width, h = c.height;

    // 1. Céu em degradê laranja/dourado
    const sky = ctx.createLinearGradient(0, 0, 0, h * 0.75);
    sky.addColorStop(0, '#1f0702');
    sky.addColorStop(0.55, '#c43e00');
    sky.addColorStop(1, '#ff9e00');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, w, h);

    // 2. Sol nascendo/se pondo suavemente com brilho
    if (sunY > h * 0.56) sunY -= 0.15; // Sobe devagar até o horizonte
    ctx.save();
    ctx.shadowBlur = 40;
    ctx.shadowColor = '#ffb700';
    ctx.fillStyle = '#fff2b2';
    ctx.beginPath();
    ctx.arc(w * 0.72, sunY, 38, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // 3. Camadas de ondas do mar na horizontal
    const waves = [
      { y: 0.62, amp: 5, freq: 0.012, speed: 0.8, color: 'rgba(255, 123, 0, 0.55)' },
      { y: 0.68, amp: 7, freq: 0.018, speed: 1.2, color: 'rgba(13, 59, 74, 0.85)' },
      { y: 0.75, amp: 9, freq: 0.022, speed: 1.6, color: '#051d26' }
    ];

    waves.forEach(wave => {
      ctx.fillStyle = wave.color;
      ctx.beginPath();
      ctx.moveTo(0, h);
      for (let x = 0; x <= w; x += 15) {
        const y = h * wave.y + Math.sin(x * wave.freq + t * wave.speed) * wave.amp;
        ctx.lineTo(x, y);
      }
      ctx.lineTo(w, h);
      ctx.fill();
    });

    requestAnimationFrame(draw);
  }
  draw();
})();
</script>
